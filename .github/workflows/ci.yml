name: CI

# The app is not at the repo root, so every step runs inside its directory.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hotsauce-dev-v7/photography-website

    steps:
      - uses: actions/checkout@v4

      # Must come before setup-node, which needs pnpm present to cache its store.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: hotsauce-dev-v7/photography-website/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: hotsauce-dev-v7/photography-website/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      # No secrets needed: the contact route reads its env vars per request,
      # not at build time, and falls back to defaults.
      - run: pnpm build
